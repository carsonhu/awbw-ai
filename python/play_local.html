<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>awbw-ai local match</title>
<style>
  body { font-family: Verdana, sans-serif; background:#ece9d8; margin:16px; }
  #wrap { display:flex; gap:16px; }
  #board { display:grid; gap:0; border:2px solid #555; width:max-content;
           background:#000; }
  .tile { width:32px; height:32px; position:relative; box-sizing:border-box;
          font-size:10px; }
  .tile img { image-rendering: pixelated; }
  img.t { position:absolute; bottom:0; left:0; width:32px; z-index:0; }
  img.u { position:absolute; bottom:1px; left:1px; width:30px; z-index:3; }
  .tile.sel  { outline:3px solid #ff3030; outline-offset:-3px; z-index:5; }
  .tile.move::after, .tile.tgt::after {
    content:""; position:absolute; inset:0; z-index:4; pointer-events:none; }
  .tile.move::after { background:rgba(80,200,255,.42); }
  .tile.tgt::after  { background:rgba(255,60,60,.45); }
  .tile.move, .tile.tgt { cursor:pointer; }
  .tile.src  { cursor:pointer; }
  .unit { position:absolute; inset:3px; border-radius:4px; display:flex;
          align-items:center; justify-content:center; font-weight:bold;
          font-size:11px; color:#fff; text-shadow:0 1px 2px #000; z-index:3; }
  .p0 { background:#d9642a; } .p1 { background:#2a66d9; }
  .dim { filter: grayscale(.8) brightness(.75); }
  .hp { position:absolute; right:0; bottom:0; font-size:10px; font-weight:bold;
        color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000; z-index:6; }
  img.hp { width:12px; height:auto; }
  .cap { position:absolute; left:1px; top:0; font-size:9px; color:#ff0;
         text-shadow:0 0 2px #000; z-index:6; }
  img.capicon { position:absolute; left:0; bottom:0; width:16px;
                height:16px; z-index:6; }
  .own0 { border-bottom:4px solid #d9642a; } .own1 { border-bottom:4px solid #2a66d9; }
  #infocard { border:2px solid #666; background:#4a4a42; color:#fff;
              border-radius:4px; padding:8px 10px; margin-top:10px;
              min-height:56px; font-size:12px; display:flex; gap:12px;
              align-items:center; }
  #infocard img { image-rendering:pixelated; width:32px; }
  #infocard .stat { line-height:1.5; }
  #side { width:300px; }
  .panel { border:2px solid #888; background:#fff; border-radius:4px;
           padding:8px 10px; margin-bottom:10px; }
  .panel.active { border-color:#d9642a; box-shadow:0 0 6px #d9642a55; }
  .panel h3 { margin:0 0 4px; font-size:13px; }
  .meter { display:flex; gap:2px; margin-top:5px; align-items:flex-end; }
  .meter .star { width:13px; background:#cfcabc; border:1px solid #8a8578;
                 position:relative; }
  .meter .star.cop { height:9px; }  .meter .star.scop { height:13px; }
  .meter .star div { position:absolute; left:0; bottom:0; width:100%;
                     background:#37b24d; }
  .meter.lit .star { background:#ffe066; }
  .meter.lit .star div { background:#f59f00; }
  button { font-family:inherit; margin:2px; padding:6px 10px; }
  #menu { position:absolute; background:#fff; border:2px solid #444; z-index:10;
          border-radius:4px; padding:4px; box-shadow:2px 3px 8px #0006; }
  #menu button { display:block; width:100%; text-align:left; }
  #menu img { image-rendering:pixelated; width:20px; vertical-align:middle;
              margin-right:6px; }
  #menu .cost { float:right; margin-left:14px; color:#444; }
  #tip { position:absolute; background:#fffef0; border:2px solid #444; z-index:11;
         padding:5px 9px; font-size:12px; pointer-events:none; border-radius:4px; }
  #log { font-size:11px; max-height:260px; overflow-y:auto; background:#fff;
         border:1px solid #aaa; padding:6px; }
  #log div { padding:1px 0; border-bottom:1px dotted #ddd; }
  #banner { font-size:20px; font-weight:bold; margin-bottom:8px; }
</style>
</head>
<body>
<div id="banner">loading&hellip;</div>
<div id="wrap">
  <div>
    <div id="board"></div>
    <div id="infocard">hover a tile</div>
  </div>
  <div id="side">
    <div class="panel" id="pl0"></div>
    <div class="panel" id="pl1"></div>
    <div class="panel">
      <button id="endturn">End Turn</button>
      <button id="cop">COP</button>
      <button id="scop">SCOP</button>
      <button id="cancel">Cancel</button>
    </div>
    <div class="panel"><h3>agent's last turn</h3><div id="log"></div></div>
  </div>
</div>
<script>
const TERRAIN_COLORS = {
  Plain:"#b0d264", Wood:"#4d8f3c", Mountain:"#a3835c", River:"#7cb6e8",
  Road:"#c9c3ae", Bridge:"#c9c3ae", Sea:"#3f79c8", Shoal:"#e5d9a2",
  Reef:"#3f79c8", City:"#b6b6b6", Base:"#b6a68a", Airport:"#b6b6b6",
  Port:"#9fb2c4", Hq:"#e0d060", ComTower:"#b6b6b6", Lab:"#b6b6b6",
};
const UNIT_CODE = { Infantry:"In", Mech:"Me", MdTank:"MT", Tank:"Tk",
  Recon:"Rc", Apc:"AP", Artillery:"Ar", Rocket:"Rk", AntiAir:"AA",
  Missile:"Mi", Fighter:"Ft", Bomber:"Bo", BCopter:"BC", TCopter:"TC",
  Battleship:"Bs", Cruiser:"Cr", Lander:"Ld", Sub:"Sb", BlackBoat:"BB",
  Carrier:"Ca", Stealth:"St", Neotank:"Nt", Piperunner:"Pr",
  BlackBomb:"Bb", MegaTank:"MG" };
const ENGINE2AWBW = { Infantry:"Infantry", Mech:"Mech", MdTank:"Md.Tank",
  Tank:"Tank", Recon:"Recon", Apc:"APC", Artillery:"Artillery",
  Rocket:"Rocket", AntiAir:"Anti-Air", Missile:"Missile", Fighter:"Fighter",
  Bomber:"Bomber", BCopter:"B-Copter", TCopter:"T-Copter",
  Battleship:"Battleship", Cruiser:"Cruiser", Lander:"Lander", Sub:"Sub",
  BlackBoat:"Black Boat", Carrier:"Carrier", Stealth:"Stealth",
  Neotank:"Neotank", Piperunner:"Piperunner", BlackBomb:"Black Bomb",
  MegaTank:"Mega Tank" };
const BUILD_NAMES = ["Infantry","Mech","Md.Tank","Tank","Recon","APC",
  "Artillery","Rocket","Anti-Air","Missile","Fighter","Bomber","B-Copter",
  "T-Copter","Battleship","Cruiser","Lander","Sub","Black Boat","Carrier",
  "Stealth","Neotank","Piperunner","Black Bomb","Mega Tank"];
const BUILD_COSTS = [1000,3000,16000,7000,4000,5000,6000,15000,8000,12000,
  20000,22000,9000,5000,28000,18000,12000,20000,7500,30000,24000,22000,
  20000,25000,28000];
const KINDS = ["wait","attack","capture","supply","join","load","unload","build"];
const DEFENSE = { Plain:1, Wood:2, Mountain:4, River:0, Road:0, Bridge:0,
  Sea:0, Shoal:0, Reef:1, City:3, Base:3, Airport:3, Port:3, Hq:4,
  ComTower:3, Lab:3, Pipe:0, Silo:3, SiloEmpty:3 };

let W, H, TILES, terrain, state;
let SPR = null, MAN = null;
let phase = "idle";
let sel = {};

const board = document.getElementById("board");
const q = (url, body) => fetch(url, body ? {method:"POST", body:JSON.stringify(body)} : {}).then(r => r.json());
const spriteUrl = f => "/sprites/" + f;
const ownerCode = o => o === 0 ? "os" : o === 1 ? "bm" : "neutral";

async function boot() {
  const t = await q("/terrain");
  W = t.width; H = t.height; TILES = W * H; terrain = t.terrain;
  SPR = t.sprites || null; MAN = t.manifest || null;
  board.style.gridTemplateColumns = `repeat(${W},32px)`;
  for (let i = 0; i < TILES; i++) {
    const d = document.createElement("div");
    d.className = "tile"; d.id = "t" + i;
    d.style.zIndex = ((i / W) | 0);
    d.addEventListener("click", () => clickTile(i));
    d.addEventListener("mouseenter", () => hoverTile(i));
    d.addEventListener("mouseleave", hideTip);
    board.appendChild(d);
  }
  refresh(await q("/state"));
}

function baseSprite(i, buildingAt) {
  const x = i % W, y = (i / W) | 0;
  const b = buildingAt[i];
  if (b && MAN) {
    const key = ownerCode(b.owner) + ":" + b.kind.toLowerCase();
    if (MAN.building[key]) return MAN.building[key];
  }
  return SPR ? SPR[y][x] : null;
}

function refresh(s) {
  state = s;
  const buildingAt = {};
  for (const b of s.buildings) buildingAt[b.y * W + b.x] = b;

  for (let i = 0; i < TILES; i++) {
    const x = i % W, y = (i / W) | 0;
    const el = document.getElementById("t" + i);
    const kind = terrain[y][x];
    el.className = "tile";
    el.innerHTML = "";
    const art = baseSprite(i, buildingAt);
    if (art) {
      el.style.background = "#b0d264";
      el.innerHTML = `<img class="t" src="${spriteUrl(art)}">`;
    } else {
      el.style.background = TERRAIN_COLORS[kind] || "#888";
    }
    const b = buildingAt[i];
    if (b && b.capture < 20) {
      el.innerHTML += (MAN && MAN.misc.capture)
        ? `<img class="capicon" src="${spriteUrl(MAN.misc.capture)}">`
        : `<span class="cap">${b.capture}</span>`;
    }
  }
  for (const u of s.units) {
    if (u.carried) continue;
    const el = document.getElementById("t" + (u.y * W + u.x));
    const hp = Math.ceil(u.hp100 / 10);
    const key = (u.moved ? "gs_" : "") + ownerCode(u.player) + ":"
                + ENGINE2AWBW[u.type];
    if (MAN && MAN.unit[key]) {
      el.innerHTML += `<img class="u" src="${spriteUrl(MAN.unit[key])}">`;
      if (hp < 10)
        el.innerHTML += MAN.misc[hp]
          ? `<img class="hp" src="${spriteUrl(MAN.misc[hp])}">`
          : `<span class="hp">${hp}</span>`;
    } else {
      el.innerHTML += `<div class="unit p${u.player}${u.moved ? " dim" : ""}">`
        + (UNIT_CODE[u.type] || "?")
        + (hp < 10 ? `<span class="hp">${hp}</span>` : "") + `</div>`;
    }
  }
  document.getElementById("banner").textContent =
    s.winner !== null
      ? (s.winner === "draw" ? "Draw." :
         s.winner === s.human ? "You win." : "Agent wins.")
      : `Day ${s.day} — ${s.current === s.human ? "your turn" : "agent thinking…"}`;
  for (const p of [0, 1]) {
    const pl = s.players[p];
    const el = document.getElementById("pl" + p);
    el.className = "panel" + (s.current === p && s.winner === null ? " active" : "");
    // AWBW's meter: one box per star, COP stars small, the SCOP-only
    // stars taller; each box fills bottom-up with its share of charge.
    const nCop = Math.max(pl.cop_stars ?? 0, 0);
    const nAll = Math.max(pl.scop_stars ?? 0, nCop);
    const per = nAll > 0 ? (pl.scop_cost ?? 0) / nAll : 0;
    let boxes = "";
    for (let i = 0; i < nAll; i++) {
      const fill = per > 0
        ? Math.max(0, Math.min(1, (pl.charge - i * per) / per)) : 0;
      boxes += `<span class="star ${i < nCop ? "cop" : "scop"}">`
        + `<div style="height:${(100 * fill).toFixed(0)}%"></div></span>`;
    }
    el.innerHTML = `<h3>${p === s.human ? "You" : "Agent"} — ${pl.co} (${ownerCode(p) === "os" ? "orange" : "blue"})</h3>`
      + `funds ${pl.funds.toLocaleString()} &middot; income ${pl.income.toLocaleString()}`
      + `<div>power: ${pl.power === "N" ? "charging" : (pl.power === "Y" ? "COP!" : "SCOP!")}</div>`
      + `<div class="meter${pl.power === "N" ? "" : " lit"}">${boxes}</div>`;
  }
  const my = s.source_mask;
  document.getElementById("endturn").disabled = !my;
  document.getElementById("cop").disabled = !(my && my[TILES + 1]);
  document.getElementById("scop").disabled = !(my && my[TILES + 2]);
  if (my) for (let i = 0; i < TILES; i++)
    if (my[i]) document.getElementById("t" + i).classList.add("src");
  document.getElementById("log").innerHTML =
    (s.agent_orders || []).map(o => `<div>${o}</div>`).join("");
  phase = "idle"; sel = {}; hideMenu(); hideTip();
}

function marks(mask, cls) {
  for (let i = 0; i < TILES; i++)
    if (mask[i]) document.getElementById("t" + i).classList.add(cls);
}
function clearMarks() {
  document.querySelectorAll(".move,.tgt,.sel").forEach(
    el => el.classList.remove("move", "tgt", "sel"));
}

async function pickDest(i) {
  sel.d = i;
  const r = await q("/kinds", { s: sel.s, d: i });
  const legal = r.mask.map((v, k) => v ? k : -1).filter(k => k >= 0);
  if (legal.length === 1) return chooseKind(legal[0]);
  showMenu(i, legal.map(k => [KINDS[k], () => chooseKind(k)]));
  phase = "placed";
}

async function clickTile(i) {
  if (!state.source_mask) return;
  if (phase === "idle") {
    if (!state.source_mask[i]) return;
    sel = { s: i };
    document.getElementById("t" + i).classList.add("sel");
    const r = await q("/dests", { s: i });
    sel.dmask = r.mask;
    const legal = r.mask.map((v, j) => v ? j : -1).filter(j => j >= 0);
    // One legal destination (a base building, a boxed-in unit): skip the
    // second click straight to the order menu.
    if (legal.length === 1) return pickDest(legal[0]);
    marks(r.mask, "move"); phase = "picked";
  } else if (phase === "picked") {
    if (!sel.dmask[i]) { cancel(); return; }
    clearMarks();
    document.getElementById("t" + sel.s).classList.add("sel");
    pickDest(i);
  } else if (phase === "param") {
    if (!sel.pmask[i]) { cancel(); return; }
    act(sel.s, sel.d, sel.k, i);
  }
}

async function chooseKind(k) {
  hideMenu();
  sel.k = k;
  const needsParam = k === 1 || k === 6 || k === 7;
  if (!needsParam) return act(sel.s, sel.d, k, 0);
  const r = await q("/params", { s: sel.s, d: sel.d, k });
  sel.pmask = r.mask;
  if (k === 7) {
    const legal = r.mask.map((v, i) => v ? i : -1).filter(i => i >= 0);
    showMenu(sel.s, legal.map(i => {
      const key = ownerCode(state.human) + ":" + BUILD_NAMES[i];
      const icon = MAN && MAN.unit[key]
        ? `<img src="${spriteUrl(MAN.unit[key])}">` : "";
      const label = `${icon}${BUILD_NAMES[i]}`
        + `<span class="cost">${BUILD_COSTS[i].toLocaleString()}</span>`;
      return [label, () => act(sel.s, sel.d, 7, i), true];
    }));
  } else {
    clearMarks();
    document.getElementById("t" + sel.s).classList.add("sel");
    marks(r.mask, "tgt");
    phase = "param";
  }
}

function infoCard(i) {
  const x = i % W, y = (i / W) | 0;
  const kind = terrain[y][x];
  const u = state.units.find(v => !v.carried && v.x === x && v.y === y);
  const card = document.getElementById("infocard");
  const stars = "★".repeat(DEFENSE[kind] ?? 0) || "–";
  let html = "";
  if (u) {
    const key = ownerCode(u.player) + ":" + ENGINE2AWBW[u.type];
    if (MAN && MAN.unit[key])
      html += `<img src="${spriteUrl(MAN.unit[key])}">`;
    html += `<div class="stat"><b>${ENGINE2AWBW[u.type]}</b><br>`
      + `hp ${Math.ceil(u.hp100 / 10)} &nbsp; fuel ${u.fuel}`
      + ` &nbsp; ammo ${u.ammo}`
      + (u.cargo ? ` &nbsp; loaded: ${u.cargo}` : "") + `</div>`;
  }
  const b = state.buildings.find(v => v.x === x && v.y === y);
  html += `<div class="stat">${kind}<br>${stars}`
    + (b && b.capture < 20 ? ` &nbsp; capture ${b.capture}/20` : "")
    + `</div>`;
  card.innerHTML = html;
}

async function hoverTile(i) {
  infoCard(i);
  if (phase !== "param" || sel.k !== 1 || !sel.pmask[i]) return;
  const r = await q("/preview", { s: sel.s, d: sel.d, p: i });
  if (!r.damage) return;
  const el = document.getElementById("t" + i).getBoundingClientRect();
  const tip = document.createElement("div");
  tip.id = "tip";
  tip.innerHTML =
    `<b>${r.damage.min === r.damage.max ? r.damage.min + "%" :
        r.damage.min + " - " + r.damage.max + "%"}</b>`
    + (r.damage.kill > 0 ? ` <span style="color:#c00">(KO ${(100 * r.damage.kill).toFixed(0)}%)</span>` : "")
    + `<br>counter: ${r.counter ? r.counter.min + " - " + r.counter.max + "%" : "none"}`;
  tip.style.left = (el.left + window.scrollX + 36) + "px";
  tip.style.top = (el.top + window.scrollY - 8) + "px";
  hideTip(); document.body.appendChild(tip);
}
function hideTip() { document.getElementById("tip")?.remove(); }

function showMenu(atTile, entries) {
  hideMenu();
  const el = document.getElementById("t" + atTile).getBoundingClientRect();
  const m = document.createElement("div");
  m.id = "menu";
  for (const [label, fn, html] of entries) {
    const b = document.createElement("button");
    if (html) b.innerHTML = label; else b.textContent = label;
    b.onclick = fn; m.appendChild(b);
  }
  m.style.left = (el.right + window.scrollX + 4) + "px";
  m.style.top = (el.top + window.scrollY) + "px";
  document.body.appendChild(m);
}
function hideMenu() { document.getElementById("menu")?.remove(); }

async function act(s, d, k, p) {
  hideMenu(); hideTip(); clearMarks();
  // Mid-turn orders return in milliseconds; the agent only computes once
  // the turn actually passes. Show the banner only when the wait is real.
  const slow = setTimeout(() => {
    document.getElementById("banner").textContent = "agent thinking…";
  }, 150);
  const next = await q("/act", { s, d, k, p });
  clearTimeout(slow);
  refresh(next);
}
function cancel() { clearMarks(); phase = "idle"; sel = {}; hideMenu(); hideTip(); }

document.getElementById("endturn").onclick = () => act(TILES, 0, 0, 0);
document.getElementById("cop").onclick = () => act(TILES + 1, 0, 0, 0);
document.getElementById("scop").onclick = () => act(TILES + 2, 0, 0, 0);
document.getElementById("cancel").onclick = cancel;
boot();
</script>
</body>
</html>
